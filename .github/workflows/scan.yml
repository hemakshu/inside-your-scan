name: Inside Your Scan

on:
  schedule:
    # Wakes up every hour from about 6:17 am to 12:17 am IST. GitHub often runs scheduled jobs late or
    # skips some, so hourly keeps things moving. Each wake-up takes ~15 seconds unless a video is being made.
    - cron: "47 0-18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [check-setup, test-preview, make-now, tick]
        default: check-setup

permissions:
  contents: write

concurrency:
  group: inside-your-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quick check (Telegram taps, publishing)
        id: tick
        if: github.event_name == 'schedule' || inputs.mode == 'tick'
        run: |
          pip install -q requests pyyaml
          python tick.py

      - name: Install video tools
        if: steps.tick.outputs.make == 'true' || inputs.mode == 'make-now' || inputs.mode == 'test-preview' || inputs.mode == 'check-setup'
        run: |
          if [ "${{ inputs.mode }}" = "check-setup" ]; then pip install -q requests pyyaml jinja2; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check setup
        if: inputs.mode == 'check-setup'
        run: python check_setup.py

      - name: Make today's video and send it to Telegram
        if: steps.tick.outputs.make == 'true' || inputs.mode == 'make-now'
        run: python make.py

      - name: Send a test preview (sample content)
        if: inputs.mode == 'test-preview'
        run: python make.py --mock

      - name: Keep a copy of what was made (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save state
        if: always()
        run: |
          git config user.name "inside-your-scan"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: $(date +%F_%H%M)" && git pull --rebase -q && git push)
